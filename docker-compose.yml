# Local stack: PostgreSQL + ApprovalLoop (API and built console on http://localhost:8080).
#   docker compose up --build
# Credentials here are for local development only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: approvalloop
      POSTGRES_PASSWORD: approvalloop
      POSTGRES_DB: approvalloop
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: demo
      DATABASE_URL: postgresql://approvalloop:approvalloop@db:5432/approvalloop
    ports: ["8080:8080"]

volumes:
  pgdata:
