name: ApprovalLoop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: approvalloop
          POSTGRES_PASSWORD: approvalloop
          POSTGRES_DB: approvalloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalloop" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Full Pytest Suite
        env:
          PYTHONPATH: backend
          APP_ENV: demo
          GOOGLE_CLOUD_PROJECT: approval-loop-hackathon
          GEMINI_MODEL: gemini-3.7-flash
          ALLOW_INSECURE_DEMO_AUTH: false
          MODEL_ARMOR_ENABLED: false
          TEST_DATABASE_URL: postgresql://approvalloop:approvalloop@localhost:5432/approvalloop_test
        run: |
          python -m pytest backend/tests -v --tb=short

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend & Typecheck (tsc + vite)
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: approval-loop:ci-test
