name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: approvalloop
          POSTGRES_PASSWORD: approvalloop
          POSTGRES_DB: approvalloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U approvalloop" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/approval_loop
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
          TEST_DATABASE_URL: postgresql://approvalloop:approvalloop@localhost:5432/approvalloop_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
